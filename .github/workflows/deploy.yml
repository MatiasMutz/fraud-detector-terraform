name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribir "deploy" para confirmar el deploy'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'deploy'

    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_VAR_google_oauth_client_id: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      TF_VAR_google_oauth_client_secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      BOOTSTRAP_EMAIL: ${{ secrets.BOOTSTRAP_EMAIL }}
      BOOTSTRAP_PASSWORD: ${{ secrets.BOOTSTRAP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare runtime spec
        run: make prepare-model

      - name: Compute processor source key
        id: processor_source
        shell: bash
        run: |
          set -euo pipefail

          source_key="$(
            {
              find app/processor app/net/serving/go -type f | sort
              printf '%s\n' \
                app/processor/model/runtime_spec.json \
                scripts/prepare_runtime_spec.py \
                app/processor/Dockerfile \
                Makefile
            } | sort -u | xargs sha256sum | sha256sum | cut -c1-16
          )"

          echo "key=${source_key}" >> "$GITHUB_OUTPUT"
          echo "tag=processor-src-${source_key}" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Go for Lambda builds
        uses: actions/setup-go@v6
        with:
          go-version-file: app/results_writer/go.mod
          cache-dependency-path: app/results_writer/go.sum

      - name: Build Lambda layers
        run: make build-layers

      - name: Build results-writer Lambda
        run: make build-results-writer

      - name: Initialize Terraform
        run: make init

      - name: Bootstrap ECR repository
        run: |
          terraform output -raw ecr_repository_url >/tmp/ecr_repository_url 2>/dev/null || true
          if grep -Eq '^[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/.+' /tmp/ecr_repository_url; then
            exit 0
          fi

          echo "No ECR repository output found yet; creating only the Terraform-managed ECR repository before the image push."
          terraform plan -target=module.compute.aws_ecr_repository.app -out=tfplan-bootstrap-ecr
          terraform apply -auto-approve tfplan-bootstrap-ecr

      - name: Read ECR image metadata
        id: ecr
        run: |
          terraform output -raw ecr_repository_url >/tmp/ecr_repository_url 2>/dev/null || true
          ecr_url="$(grep -E '^[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/.+' /tmp/ecr_repository_url | tail -n 1)"
          if [ -z "$ecr_url" ]; then
            echo "Terraform output ecr_repository_url is empty after bootstrap apply." >&2
            echo "Raw terraform output was:" >&2
            cat /tmp/ecr_repository_url >&2
            exit 1
          fi

          short_sha="${GITHUB_SHA::12}"
          processor_tag="processor-${short_sha}"

          echo "url=${ecr_url}" >> "$GITHUB_OUTPUT"
          echo "registry=${ecr_url%%/*}" >> "$GITHUB_OUTPUT"
          echo "repository=${ecr_url#*/}" >> "$GITHUB_OUTPUT"
          echo "processor_tag=${processor_tag}" >> "$GITHUB_OUTPUT"
          echo "processor_image=${ecr_url}:${processor_tag}" >> "$GITHUB_OUTPUT"
          echo "processor_source_image=${ecr_url}:${{ steps.processor_source.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Resolve processor image deployment
        id: processor_image
        shell: bash
        run: |
          set -euo pipefail

          should_build="false"
          final_image="${{ steps.ecr.outputs.processor_image }}"

          if aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "${{ steps.ecr.outputs.repository }}" \
            --image-ids "imageTag=${{ steps.processor_source.outputs.tag }}" \
            --query 'imageDetails[0].imageDigest' \
            --output text >/tmp/source-image-digest 2>/dev/null; then
            digest="$(cat /tmp/source-image-digest)"
            echo "The processor source image already exists in ECR."
            final_image="${{ steps.ecr.outputs.url }}@${digest}"
          else
            echo "No reusable processor source image exists in ECR; building a new image for this deploy."
            should_build="true"
          fi

          echo "should_build=${should_build}" >> "$GITHUB_OUTPUT"
          echo "final_image=${final_image}" >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        if: steps.processor_image.outputs.should_build == 'true'
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${{ steps.ecr.outputs.registry }}"

      - name: Build processor image
        if: steps.processor_image.outputs.should_build == 'true'
        run: docker build -f app/processor/Dockerfile -t "fraud-worker:${GITHUB_SHA}" app

      - name: Tag processor image for ECR
        if: steps.processor_image.outputs.should_build == 'true'
        run: |
          docker tag "fraud-worker:${GITHUB_SHA}" "${{ steps.ecr.outputs.processor_image }}"
          docker tag "fraud-worker:${GITHUB_SHA}" "${{ steps.ecr.outputs.processor_source_image }}"

      - name: Push processor image
        if: steps.processor_image.outputs.should_build == 'true'
        run: |
          docker push "${{ steps.ecr.outputs.processor_image }}"
          docker push "${{ steps.ecr.outputs.processor_source_image }}"

      - name: Terraform plan
        run: |
          mkdir -p app/api/build app/notification/build
          terraform plan \
            -out=tfplan \
            -var "image_uri=${{ steps.processor_image.outputs.final_image }}"

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Migrate RDS schema
        run: make migrate-db

      - name: Read dashboard deployment outputs
        id: dashboard
        run: |
          echo "bucket=$(terraform output -raw dashboard_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(terraform output -raw cognito_client_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_domain_url=$(terraform output -raw cognito_domain_url)" >> "$GITHUB_OUTPUT"
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_issuer=$(terraform output -raw cognito_issuer)" >> "$GITHUB_OUTPUT"
          echo "dashboard_app_url=$(terraform output -raw dashboard_app_url)" >> "$GITHUB_OUTPUT"

      - name: Build dashboard for S3
        run: |
          docker build \
            -f app/dashboard/Dockerfile \
            --target export \
            --build-arg "API_BASE=${{ steps.dashboard.outputs.api_endpoint }}" \
            --build-arg "COGNITO_CLIENT_ID=${{ steps.dashboard.outputs.cognito_client_id }}" \
            --build-arg "COGNITO_DOMAIN=${{ steps.dashboard.outputs.cognito_domain_url }}" \
            --build-arg "COGNITO_REDIRECT_URI=${{ steps.dashboard.outputs.dashboard_app_url }}" \
            --build-arg "COGNITO_LOGOUT_URI=${{ steps.dashboard.outputs.dashboard_app_url }}" \
            --build-arg "COGNITO_USER_POOL_ID=${{ steps.dashboard.outputs.cognito_user_pool_id }}" \
            --build-arg "COGNITO_ISSUER=${{ steps.dashboard.outputs.cognito_issuer }}" \
            --output type=local,dest=dashboard-dist \
            app

      - name: Deploy dashboard to S3
        run: |
          aws s3 sync dashboard-dist "s3://${{ steps.dashboard.outputs.bucket }}/" \
            --delete \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Bootstrap dashboard admin
        if: env.BOOTSTRAP_EMAIL != ''
        run: make bootstrap-auth

      - name: Write deployment summary
        run: |
          {
            echo "## Deployment outputs"
            echo ""
            echo "| Output | Value |"
            echo "|--------|-------|"
            echo "| dashboard_url | \`$(terraform output -raw dashboard_url)\` |"
            echo "| api_endpoint | \`$(terraform output -raw api_endpoint)\` |"
            echo "| queue_url | \`$(terraform output -raw queue_url)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
