name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format & Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.9"

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/results_writer/go.mod
          cache-dependency-path: app/results_writer/go.sum

      - name: Test API Lambda
        run: python3 -m unittest app/api/test_handler.py

      - name: Test results-writer Lambda
        working-directory: app/results_writer
        run: go test ./...

      - name: Build Lambda layers
        run: make build-layers

      - name: Build results-writer Lambda
        run: make build-results-writer

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
